[workspace]
resolver = "3"
members = ["crates/p12-core", "crates/p12-midi", "crates/p12-cli", "crates/p12-sim", "app/src-tauri"]
# The GUI needs webkit2gtk; keep plain `cargo build`/`cargo test` working without it.
default-members = ["crates/p12-core", "crates/p12-midi", "crates/p12-cli", "crates/p12-sim"]

[workspace.package]
version = "1.0.1"
edition = "2024"
# MIT, see LICENSE. Not published to crates.io.
license = "MIT"
publish = false

[workspace.dependencies]
p12-core = { path = "crates/p12-core" }
p12-midi = { path = "crates/p12-midi" }
thiserror = "2"
