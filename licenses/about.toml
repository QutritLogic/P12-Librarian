# cargo-about configuration for the third-party licence list (see licenses/generate.sh).
# Only licences that allow use in free, closed-source software are accepted;
# a dependency under any other licence makes the generation fail.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "0BSD",
    "Unlicense",
]
targets = ["x86_64-unknown-linux-gnu"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# P12 Librarian's own packages are not third-party code.
private = { ignore = true }
